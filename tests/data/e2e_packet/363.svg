<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-packet" viewBox="0 0 1035 62" width="1035" height="62" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="packet" aria-describedby="pele-desc"><desc id="pele-desc">A packet description</desc><g class="pele-packet-fields" font-size="14" text-anchor="middle"><g class="pele-node" data-id="0-3"><rect x="8" y="22" width="123" height="32" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text x="69.5" y="42.9">IHL</text></g><g class="pele-node" data-id="4-11"><rect x="136" y="22" width="251" height="32" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text x="261.5" y="42.9">a&lt;br/&gt;b</text></g><g class="pele-node" data-id="12-13"><rect x="392" y="22" width="59" height="32" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text x="421.5" y="42.9">Data</text></g></g><g class="pele-packet-bits" font-size="10" fill="var(--_m)"><text x="8" y="18">0</text><text x="131" y="18" text-anchor="end">3</text><text x="136" y="18">4</text><text x="387" y="18" text-anchor="end">11</text><text x="392" y="18">12</text><text x="451" y="18" text-anchor="end">13</text></g></svg>