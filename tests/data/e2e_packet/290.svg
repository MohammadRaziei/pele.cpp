<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-packet" viewBox="0 0 1043 70" width="1043" height="70" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="packet" aria-labelledby="pele-title"><title id="pele-title">Packet acc</title><g class="pele-packet-fields" font-size="14" text-anchor="middle"><g class="pele-node" data-id="0-3"><rect x="12" y="26" width="123" height="32" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text x="73.5" y="46.9">Checksum</text></g><g class="pele-node" data-id="4-4"><rect x="140" y="26" width="27" height="32" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text x="153.5" y="46.9">it's</text></g><g class="pele-node" data-id="5-5"><rect x="172" y="26" width="27" height="32" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text x="185.5" y="44.8" font-size="8">Flags</text></g><g class="pele-node" data-id="6-21"><rect x="204" y="26" width="507" height="32" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text x="457.5" y="46.9">Data</text></g></g><g class="pele-packet-bits" font-size="10" fill="var(--_m)"><text x="12" y="22">0</text><text x="135" y="22" text-anchor="end">3</text><text x="153.5" y="22" text-anchor="middle">4</text><text x="185.5" y="22" text-anchor="middle">5</text><text x="204" y="22">6</text><text x="711" y="22" text-anchor="end">21</text></g></svg>