# Read by CMake (configure_file) into <build>/.clang-uml; the @...@ values come from CMakeLists.txt.
# Add a diagram here, then: cmake -B build -DPELE_ENABLE_UML=ON -DPELE_UML_DIAGRAM=<name>
compilation_database_dir: "@PELE_UML_COMPILATION_DATABASE_DIR@"
output_directory: "@PELE_UML_OUTPUT_DIR@"

diagrams:
  # The pipeline every diagram type shares: public API, text, labels, tokens, layout.
  core_class:
    type: class

    # IMPORTANT: This glob must match at least one TU that exists in compile_commands.json
    glob:
      - "@PELE_UML_TU@"

    using_namespace: pele

    include:
      namespaces:
        - pele

    exclude:
      namespaces:
        - pele::flowchart
        - pele::info
        - pele::packet

  # What each diagram type adds: its parser, model and renderer.
  diagrams_class:
    type: class

    glob:
      - "@PELE_UML_TU@"

    using_namespace: pele

    include:
      namespaces:
        - pele::flowchart
        - pele::info
        - pele::packet
